# MCUboot config for Every Watch — single-slot USB DFU
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_SINGLE_APPLICATION_SLOT=y

# Image verification
#
# CONFIG_BOOT_VALIDATE_SLOT0=y (MCUboot default) means every boot verifies the
# image's SHA-256 TLV against flash contents, so a half-written or corrupted
# DFU upload is rejected and the USB DFU window is offered again on next boot.
# That is the integrity guarantee we actually want.
#
# Hash-only. There is deliberately NO signature.
#
# This project wants integrity, not authenticity: the question being asked is
# "did this image arrive intact", not "did we authorise it". SHA-256 answers the
# first completely. It does not answer the second at all — anyone who can reach
# the DFU button can flash anything — and that is an accepted, deliberate
# trade, not an oversight. Do not "fix" it by adding a signature without also
# deciding whose key signs and where the private half lives.
#
# What was here before answered neither question honestly. RSA-2048, then
# ECDSA-P256, both against key files MCUboot *publishes in its own repository*
# (root-rsa-2048.pem, root-ec-p256.pem) — anyone can sign with those, so the
# security value was exactly nil while the verification code and embedded
# public key cost real bootloader flash, in a 48 KB partition that is the
# binding constraint on this design (see RECOVERY.md).
#
# CONFIG_BOOT_VALIDATE_SLOT0=y (MCUboot's default) is what does the actual work:
# every boot verifies the image's SHA-256 TLV against flash, so a half-written
# or corrupted DFU upload is rejected and the bootloader offers DFU again rather
# than chainloading rubbish. That is unchanged by dropping the signature.
#
# NOTE: this needs patches/nrf-imgtool-hash-only.patch. NCS v2.7.0's
# nrf/modules/mcuboot/CMakeLists.txt passes `--key` to imgtool unconditionally,
# and with no key configured it resolves to the mcuboot module *directory*, so
# the build dies with PermissionError. The patch makes `--key` conditional.
# Without it applied, this line does not build — see patches/README.md.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# DFU entry: hold the left button. Bootloader mode is a mode, not a window.
#
# MCUboot samples mcuboot-button0 (P0.17, active low) before booting the app.
# Held    -> enumerate as USB DFU and wait_for_usb_dfu(K_FOREVER): it stays
#            there until an image is flashed, however long that takes.
# Released-> boot straight through, no delay at all.
#
# This replaces CONFIG_BOOT_USB_DFU_WAIT + WAIT_DELAY_MS=5000, which opened a
# fixed 5 s window on every boot: a delay nobody asked for on every normal
# start, and a mode that evaporated under you the moment you actually wanted
# it. Entering bootloader mode deliberately should keep the device there.
#
# Recovery is stronger than the timed window, not weaker: the pin is read
# before any application code runs, so a bricked or hard-faulting image cannot
# prevent entry, and there is no race to lose against a timeout. To recover a
# dead watch, power it on with the left button held.
#
# The in-app gesture still works -- both buttons held for 2 s calls
# sys_reboot(). Note the LEFT button is the one MCUboot samples, so keep it held
# through the reset even though the app gesture needed both. DETECT_DELAY
# re-samples the pin after 500 ms so a brief press at power-on boots normally
# rather than dropping into the bootloader.
#
# TRADE-OFF, deliberate: K_FOREVER has no software escape, and there is no reset
# pin, so a hold with no cable attached sits in DFU until the cell is flat --
# usb_dc_attach() succeeds regardless of VBUS, so MCUboot never learns there is
# nothing on the other end. Entry needs a deliberate hold through a power cycle,
# so it is hard to trigger by accident.
#
# Gating the wait on cable presence is possible and does NOT need a PCB change,
# contrary to what this comment said for a long time: VBUS is wired to the SoC
# and readable from the POWER peripheral (USBREGSTATUS.VBUSDETECT), no GPIO
# involved -- see vbus_init() in src/battery/battery.c for the application-side
# equivalent. It would have to be added to MCUboot's own boot path, which is
# where the flash budget below becomes the real obstacle.
#
#   dfu-util -d 2fe3:0100 -a 0 -D build/zephyr/app_update.bin
CONFIG_BOOT_USB_DFU_GPIO=y
CONFIG_BOOT_USB_DFU_DETECT_DELAY=500

# BOOT_USB_DFU_GPIO does not select GPIO itself, and MCUboot does not enable it
# by default. Without this, io.c compiles but fails to link against the gpio0
# device (undefined reference to __device_dts_ord_9).
CONFIG_GPIO=y

# Watchdog: catches USB DFU getting genuinely stuck. Unplugging the cable is no
# escape — the watch keeps running off its own battery and there is no reset pin
# — so before this, a wedged DFU session needed SWD to recover from, with no way
# back in over USB.
#
# CONFIG_NRFX_WDT is unconditionally selected by CONFIG_WDT_NRFX on this SoC
# (see modules/hal_nordic/nrfx/Kconfig — NRFX_WDT0 selects NRFX_WDT), which
# means MCUboot's own mcuboot_config.h always takes its CONFIG_NRFX_WDT
# branch — the "generic driver" #elif that RECOVERY.md's original plan
# assumed was reachable is not, on this hardware, no matter what's enabled
# here. That branch upstream also only ever defined a feed macro, never a
# setup one, and MCUBOOT_WATCHDOG_SETUP() fell through to an empty fallback.
# Fixed with a local patch to bootloader/mcuboot's own mcuboot_config.h (see
# the comment there) rather than anything expressible via Kconfig alone.
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y
