# MCUboot config for Every Watch — single-slot USB DFU
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_SINGLE_APPLICATION_SLOT=y

# Image verification
#
# CONFIG_BOOT_VALIDATE_SLOT0=y (MCUboot default) means every boot verifies the
# image's SHA-256 TLV against flash contents, so a half-written or corrupted
# DFU upload is rejected and the USB DFU window is offered again on next boot.
# That is the integrity guarantee we actually want.
#
# The signature on top of it is currently RSA-2048 against root-rsa-2048.pem —
# MCUboot's test key, published in its repo. It provides no security (anyone
# can sign with it) but costs bootloader flash.
#
# CONFIG_BOOT_SIGNATURE_TYPE_NONE=y would give hash-only verification, but it
# does NOT build on NCS v2.7.0's child_image path: nrf/modules/mcuboot/
# CMakeLists.txt line 426 passes `--key` to imgtool unconditionally, and with
# no key configured the path resolves to the mcuboot module directory and the
# build dies with PermissionError. Revisit if the project ever moves to
# sysbuild, where SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE is handled properly.

# On every boot MCUboot starts USB and waits 5 seconds for dfu-util before
# booting the app. The app triggers re-entry into this window by calling
# sys_reboot() (e.g. on 3-second left-button hold). Upload tool: dfu-util.
#   dfu-util -d 2fe3:0100 -a 0 -D build/zephyr/app_update.bin
CONFIG_BOOT_USB_DFU_WAIT=y
CONFIG_BOOT_USB_DFU_WAIT_DELAY_MS=5000
