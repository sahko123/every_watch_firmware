# RSSI monitor — periodic BLE signal-strength table over RTT (SWD, no USB)
#
#   west build -b every_watch/nrf52833 every_watch_firmware -d build_rssi \
#       -- -DEXTRA_CONF_FILE=rssi_monitor.conf
#
# A console-only build: no self-test, no shell, nothing but advertising,
# scanning, and a device/RSSI table printed to RTT every 3 s (see
# CONFIG_EW_BLE_SCAN_DEBUG's help in Kconfig, and rssi_print_fn() in
# src/ble/ble.c). Console is RTT because it needs no pins, works on battery,
# and is alive from the first instruction — but that means a J-Link on the
# SWD pads and a viewer attached (README.md's rtt.sh) to see anything.
#
# Not layered on bringup.conf — same self-contained-per-variant pattern as
# bringup.conf/bringup_usb.conf, so this is the whole build in one file.

# ── Console ───────────────────────────────────────────────────────────────
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# ── Logging ───────────────────────────────────────────────────────────────
# INFO, not DEBUG: level 4 enables <dbg> for every subsystem including kernel
# mutex tracing, which would flood the table between prints. Immediate mode
# so nothing sits in the deferred buffer if the board is unplugged mid-run.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# ── RSSI table ────────────────────────────────────────────────────────────
# Also switches scanning to active/100% duty cycle instead of the normal
# passive/10% (see the scan_param comment in ble.c) — real power cost, which
# is why this whole variant is bring-up only.
CONFIG_EW_BLE_SCAN_DEBUG=y

# ── Debuggability ─────────────────────────────────────────────────────────
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_RESET_ON_FATAL_ERROR=n
