# Stage 0 — minimal first-power-on image.
#
#   west build -b every_watch/nrf52833 every_watch_firmware -p always \
#       -d build_stage0 -- -DCONF_FILE=stage0.conf \
#                          -DEXTRA_DTC_OVERLAY_FILE=stage0.overlay
#
# The overlay is required — it disables the sensor and RTC devicetree nodes.
# Without it the out-of-tree FRTC8900 driver selects RTC and conflicts with
# CONFIG_RTC=n below.
#
# This REPLACES prj.conf (CONF_FILE, not EXTRA_CONF_FILE). That is deliberate:
# stage 0 needs BT, SENSOR and RTC switched off, and overlaying would leave
# prj.conf's CONFIG_BT_PERIPHERAL=y etc. depending on symbols that are now n,
# which Kconfig treats as an error.
#
# No MCUboot either — the image links at 0x0 and runs directly, so there is one
# less moving part between you and a console banner.

# ── Console over SEGGER RTT ───────────────────────────────────────────────
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# INFO, not DEBUG. Level 4 turns on <dbg> for every subsystem including the
# kernel's mutex tracing, which emits thousands of lines a second and buries
# the report under its own noise. Raise individual modules if you need to.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# Boot output is written before any host attaches. RTT is in NO_BLOCK_SKIP
# mode, so anything that does not fit is silently dropped — a bigger buffer
# keeps the whole report until the debugger picks it up.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# ── Shell, on a separate RTT channel from the log backend ─────────────────
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_RTT_BUFFER=1
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=3
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=3
CONFIG_I2C_SHELL=y
CONFIG_DEVICE_SHELL=y

# ── The only peripherals that are touched ─────────────────────────────────
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_HWINFO=y

# ── Everything that could hang during driver init stays off ───────────────
# BMI270 uploads an ~8 KB config blob over I2C at init; the FRTC8900 driver has
# never run on hardware. Neither is welcome before the bus is known good.
CONFIG_SENSOR=n
CONFIG_RTC=n
CONFIG_SPI=n
CONFIG_BT=n

# ── Debuggability ─────────────────────────────────────────────────────────
CONFIG_ARM_MPU=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y

# ── Application ───────────────────────────────────────────────────────────
CONFIG_EW_STAGE0=y
