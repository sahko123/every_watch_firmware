# Bring-up overlay — console over USB CDC ACM (no debugger needed)
#
#   west build -b every_watch/nrf52833 every_watch_firmware \
#       -- -DEXTRA_CONF_FILE=bringup_usb.conf \
#          -DEXTRA_DTC_OVERLAY_FILE=bringup_usb.overlay
#
# The overlay is required: it points chosen/zephyr,console at cdc_acm_uart0.
# Without it the build fails on an undeclared zephyr_console device.
#
# Same self-test and shell as bringup.conf, but the console comes out of the USB
# port as a virtual COM port. Use this once the board is known good and you are
# updating over USB with dfu-util rather than SWD.
#
# Note the normal image (prj.conf) now carries USB CDC too, so this variant is
# no longer the only way to reach a shell over the cable. The difference is what
# rides on it: prj.conf binds only zephyr,shell-uart, so it gets the shell and
# nothing else, while this file also takes zephyr,console — logging, printk and
# the self-test report. Reach for this when you need to *watch* the watch; the
# normal image is enough when you only need to type at it.
#
# Trade-off vs RTT: USB has to enumerate before anything can print, so the first
# ~1 s of boot output is lost and a crash during early init shows you nothing.
# The self-test waits for the host to open the port (see below) so the report
# itself is never truncated, but for diagnosing an early hang use bringup.conf.

# ── Console ───────────────────────────────────────────────────────────────
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Every Watch"
CONFIG_USB_CDC_ACM=y

# The app MUST NOT share a USB ID with the bootloader.
#
# Zephyr defaults to 2FE3:0100, and that is exactly what MCUboot enumerates as
# in runtime mode (2FE3:FFFF once it is actually in DFU). Leaving the default
# broke this build in two ways at once.
#
# Windows binds drivers per VID:PID. Zadig has WinUSB bound to 2FE3:0100 so
# dfu-util can reach MCUboot — so the CDC app came up under WinUSB too and no
# virtual COM port was ever created. The console and the settime shell command
# were both working; there was simply nothing for a host to open.
#
# And flash_usb.sh keys off the same ID: seeing 2fe3:0100 it concludes the
# bootloader is in runtime mode and sends a DFU detach, which against a running
# CDC app goes nowhere. The tooling could not tell "app" from "bootloader".
#
# 0x0101 keeps the vendor ID but gives the app its own product ID, so Windows
# can bind usbser.sys here (no Zadig needed — CDC-ACM is a standard class)
# while WinUSB stays on 0100/FFFF for dfu-util.
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0101
CONFIG_USB_DEVICE_MANUFACTURER="Every Watch"
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG_BACKEND_UART=y

# Block until the host actually opens the virtual COM port, so the self-test
# report is not printed into the void while the terminal is still connecting.
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y

# ── Logging ───────────────────────────────────────────────────────────────
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_MODE_IMMEDIATE=y

# ── Self-test ─────────────────────────────────────────────────────────────
CONFIG_EW_SELFTEST=y

# ── Interactive shell ─────────────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_DEVICE_SHELL=y

CONFIG_MAIN_STACK_SIZE=4096

# prj.conf uses nano printf to save ~1 KB, but SENSOR_SHELL force-selects
# floating-point printf support, which nano cannot provide. Bring-up builds are
# not flash constrained, so take the full implementation.
CONFIG_CBPRINTF_NANO=n
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Debuggability ─────────────────────────────────────────────────────────
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_THREAD_NAME=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_RESET_ON_FATAL_ERROR=n
