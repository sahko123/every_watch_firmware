# Core
CONFIG_ARM_MPU=y
CONFIG_I2C=y
CONFIG_GPIO=y

# RTC
CONFIG_RTC=y
# RTC_ALARM was enabled with no caller anywhere in src/ (only rtc_get_time()/
# rtc_set_time() are ever used) — the FRTC8900 driver's init is gated on this
# symbol and, whenever it's set, unconditionally arms a GPIO edge interrupt +
# pull-up on P0.0 (int-gpios in the devicetree) for an alarm feature nothing
# exercises. Dropped; re-add if an alarm-driven wake path is ever built.

# LED matrix — WS2812B driven by 4x PWM + EasyDMA, one instance per data line.
# WS2812B is self-clocked, so no SPI and no clock pin is involved; PWM generates
# the pulse-width waveform directly on P0.29 / P0.28 / P0.02 / P0.03.
# Used through nrfx directly (Zephyr's PWM API cannot express DMA sequences),
# so the Zephyr pwm nodes stay disabled in the devicetree.
CONFIG_NRFX_PWM0=y
CONFIG_NRFX_PWM1=y
CONFIG_NRFX_PWM2=y
CONFIG_NRFX_PWM3=y

# IMU — BMI270 accelerometer/gyroscope
CONFIG_SENSOR=y
CONFIG_BMI270=y
# Any-motion (wrist-tilt) interrupt on INT1, delivered on the system workqueue —
# imu.c uses it to wake the display, same as a button press.
CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y

# BLE — peripheral (phone) + observer (encounter scanning)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="EveryWatch"
CONFIG_BT_DEVICE_APPEARANCE=192
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Bond key persistence — without BT_SETTINGS bonds are RAM-only and lost on reboot
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Connection parameters: without these, BT_GAP_PERIPHERAL_PREF_PARAMS defaults
# to a 30-50 ms interval at zero slave latency (Zephyr's own Kconfig default),
# and BT_GAP_AUTO_UPDATE_CONN_PARAMS (also default y for peripherals) actively
# requests the phone renegotiate to exactly that a few seconds into every
# connection — the radio then has to service every single connection event
# even while completely idle. Explicit values here let it skip up to 4 events
# when there's nothing to send. iOS in particular tends to apply its own
# connection-parameter policy regardless of what's requested, so treat this as
# a partial win on platforms that do honor it, not a guarantee.
# MIN/MAX_INT are in 1.25 ms units (80/160 -> 100/200 ms), TIMEOUT in 10 ms
# units (400 -> 4 s). Kconfig fragments don't support trailing comments on a
# value line, hence spelling that out here instead of inline.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Power management — CPU sleeps between events. PM_DEVICE only actually saves
# anything today for the I2C0 bus controller itself (idles via the i2c0_sleep
# pinctrl state in the devicetree) — none of BMI270, BH1750, or the custom
# FRTC8900 driver implement PM_DEVICE actions, so this buys nothing for the
# sensors hanging off that bus. BQ27441 is the one sensor whose driver does
# support it, and it's explicitly off below pending hardware wiring.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
# BQ274xx hardware PM needs int-gpios wired up; disable until that's done
CONFIG_BQ274XX_PM=n

# Identity persistence — NVS on identity_partition (separate from storage_partition)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# MCUboot integration — app linked at slot0, image header/hash added at build time.
# Firmware updates: hold left button 3 s -> app calls sys_reboot() -> MCUboot
# opens USB DFU window (5 s) -> dfu-util flashes new image. Works whether the
# watch is on battery or USB power because the window opens after every reboot.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_REBOOT=y

# -Os across the whole build — saves 20-30 KB vs the default -O2
CONFIG_SIZE_OPTIMIZATIONS=y

# Nano printf: drops float/long-long format support, saves ~1 KB.
# Safe: we log at ERROR level only and never format floats.
CONFIG_CBPRINTF_NANO=y

# Logging — ERROR level only to keep flash usage down.
# Raise individual modules at LOG_MODULE_REGISTER() level when debugging.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
