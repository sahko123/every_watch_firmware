# Core
CONFIG_ARM_MPU=y
CONFIG_I2C=y
CONFIG_GPIO=y

# RTC
CONFIG_RTC=y
# RTC_ALARM was enabled with no caller anywhere in src/ (only rtc_get_time()/
# rtc_set_time() are ever used) — the FRTC8900 driver's init is gated on this
# symbol and, whenever it's set, unconditionally arms a GPIO edge interrupt +
# pull-up on P0.0 (int-gpios in the devicetree) for an alarm feature nothing
# exercises. Dropped; re-add if an alarm-driven wake path is ever built.

# LED matrix — WS2812B driven by 4x PWM + EasyDMA, one instance per data line.
# WS2812B is self-clocked, so no SPI and no clock pin is involved; PWM generates
# the pulse-width waveform directly on P0.29 / P0.28 / P0.02 / P0.03.
# Used through nrfx directly (Zephyr's PWM API cannot express DMA sequences),
# so the Zephyr pwm nodes stay disabled in the devicetree.
CONFIG_NRFX_PWM0=y
CONFIG_NRFX_PWM1=y
CONFIG_NRFX_PWM2=y
CONFIG_NRFX_PWM3=y

# IMU — BMI260 accelerometer/gyroscope (see modules/bmi260, in-repo driver)
CONFIG_SENSOR=y
CONFIG_BMI260=y
# Any-motion (wrist-tilt) interrupt on INT1, delivered on the system workqueue —
# imu.c uses it to wake the display, same as a button press.
CONFIG_BMI260_TRIGGER_GLOBAL_THREAD=y

# BLE — peripheral (phone) + observer (encounter scanning)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="EveryWatch"
CONFIG_BT_DEVICE_APPEARANCE=192
CONFIG_BT_MAX_CONN=1

# Scan from the identity address. Without this the watch never advertised at
# all, on any build, since scanning and advertising were first enabled together.
#
# bt_ready() starts the passive scanner before the advertiser. With privacy off
# the scanner takes a non-resolvable private address, so when advertising then
# asks for the identity address the host has to issue LE Set Random Address —
# which the controller refuses while a scan is running (Core Spec Vol 4, Part E,
# 7.8.4, command disallowed). bt_le_adv_start() returned -EACCES every time, and
# because start_adv() bails on error it never scheduled the slow-advertising
# work either, so nothing was ever on air.
#
# Sharing one address between both roles removes the address change entirely.
# It costs no privacy here: the scanner is passive, so it never transmits, and
# the advertising payload carries a stable identity hash regardless.
CONFIG_BT_SCAN_WITH_IDENTITY=y

# Transmit power, +8 dBm — the nRF52833's ceiling.
#
# NOT CONFIG_BT_CTLR_TX_PWR_PLUS_8. That belongs to Zephyr's open-source
# controller and is silently ignored by the SoftDevice Controller this build
# uses: the symbol is accepted, the generated .config shows "=8", and the radio
# stays at 0 dBm. See EW_BLE_TX_POWER_DBM in Kconfig — it goes through the SDC's
# runtime vendor command instead and logs the level the controller selected, so
# the setting can be seen to have taken rather than assumed.
#
# A stopgap for the RF fault, not a design choice. The front end is ~50-75 dB
# down, so 8 dB does not come close to fixing it, and it does nothing for
# reception. Put this back to 0 once the antenna radiates.
CONFIG_EW_BLE_TX_POWER_DBM=8

# Compiles the VS write/read-tx-power handler into the controller. Without it
# the command is simply not recognised and returns -EIO. Kconfig will not let
# an int symbol select this, so the two have to be kept together by hand.
CONFIG_BT_HCI_VS=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

CONFIG_BT_SMP=y

# The watch has no input and no display, so its IO capability is
# NoInputNoOutput and Just Works is the only association model available to it.
# That produces an unauthenticated link — security level 2 — which is exactly
# what the BT_GATT_PERM_*_ENCRYPT permissions on this service require.
#
# ENFORCE_MITM defaults to y and asks for man-in-the-middle protection, which
# Just Works cannot provide by definition. Nothing here requests level 3, so it
# has not bitten, but leaving it on states a requirement the hardware can never
# meet — and a peer that takes it at its word would fail to pair for a reason
# that would be very hard to see from this end.
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_BONDABLE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Bond key persistence — without BT_SETTINGS bonds are RAM-only and lost on reboot
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Connection parameters: without these, BT_GAP_PERIPHERAL_PREF_PARAMS defaults
# to a 30-50 ms interval at zero slave latency (Zephyr's own Kconfig default),
# and BT_GAP_AUTO_UPDATE_CONN_PARAMS (also default y for peripherals) actively
# requests the phone renegotiate to exactly that a few seconds into every
# connection — the radio then has to service every single connection event
# even while completely idle. Explicit values here let it skip up to 4 events
# when there's nothing to send. iOS in particular tends to apply its own
# connection-parameter policy regardless of what's requested, so treat this as
# a partial win on platforms that do honor it, not a guarantee.
# MIN/MAX_INT are in 1.25 ms units (80/160 -> 100/200 ms), TIMEOUT in 10 ms
# units (400 -> 4 s). Kconfig fragments don't support trailing comments on a
# value line, hence spelling that out here instead of inline.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Watchdog — MCUboot starts it (child_image/mcuboot.conf) with a fixed 30s
# hardware timeout; the nRF52's reload value can only be set before the
# peripheral starts, so this app inherits that same window rather than
# picking its own. src/watchdog/watchdog.c feeds it every ~10s. See
# RECOVERY.md and child_image/mcuboot.conf's comments for why this exists.
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y

# Power management — CPU sleeps between events. PM_DEVICE only actually saves
# anything today for the I2C0 bus controller itself (idles via the i2c0_sleep
# pinctrl state in the devicetree) — none of BMI270, BH1750, or the custom
# FRTC8900 driver implement PM_DEVICE actions, so this buys nothing for the
# sensors hanging off that bus. BQ27441 is the one sensor whose driver does
# support it, and it's explicitly off below pending hardware wiring.
# CONFIG_PM is deliberately NOT set — it never worked here.
#
# It was set to y for a long time and never appeared in the generated .config
# at all. Zephyr's system power management depends on HAS_PM, which is not
# selected for this SoC in NCS 2.7, and the CONFIG_PM_* namespace in an NCS
# build belongs to the Partition Manager rather than to power management. So
# the line read as "the CPU sleeps between events" while enabling nothing.
#
# Little is lost in practice: Zephyr's idle thread still calls k_cpu_idle(),
# and the nRF52 enters System ON low-power on WFI by itself. What is missing is
# the policy framework for deeper states — worth revisiting if the <10 uA
# target is ever pursued seriously, but it needs more than a config line.
CONFIG_PM_DEVICE=y
# BQ274xx hardware PM needs int-gpios wired up; disable until that's done
CONFIG_BQ274XX_PM=n

# Identity persistence — NVS on identity_partition (separate from storage_partition)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# MCUboot integration — app linked at slot0, image header/hash added at build time.
# Firmware updates: hold left button 3 s -> app calls sys_reboot() -> MCUboot
# opens USB DFU window (5 s) -> dfu-util flashes new image. Works whether the
# watch is on battery or USB power because the window opens after every reboot.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_REBOOT=y

# -Os across the whole build — saves 20-30 KB vs the default -O2
CONFIG_SIZE_OPTIMIZATIONS=y

# Nano printf: drops float/long-long format support, saves ~1 KB.
# Safe: we log at ERROR level only and never format floats.
CONFIG_CBPRINTF_NANO=y

# Logging — ERROR level only to keep flash usage down.
# Raise individual modules at LOG_MODULE_REGISTER() level when debugging.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
