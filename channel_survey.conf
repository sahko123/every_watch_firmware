# Channel energy survey — raw RF dBm per BLE channel over RTT (SWD, no USB)
#
#   west build -b every_watch/nrf52833 every_watch_firmware -d build_survey \
#       -- -DEXTRA_CONF_FILE=channel_survey.conf
#
# Console-only build: no self-test, no shell — just advertising, scanning,
# and the QoS channel-energy survey (CONFIG_EW_BLE_CHANNEL_SURVEY, see its
# help in Kconfig and survey_report() in src/ble/ble.c) printing measured
# energy for all 40 BLE channels roughly twice a second. This is the more
# direct antenna test of the two BLE diagnostics in this project — it reads
# raw RF energy straight from the radio, not advertisements from other
# devices, so it needs no reference transmitter and no known distance.
#
# Requires a J-Link on the SWD pads; see bringup.conf for the general RTT
# console setup this borrows (README.md's rtt.sh opens the viewer, or use
# tools/channel_survey_plot.py for a live bar graph instead of raw text).

# ── Console ───────────────────────────────────────────────────────────────
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# ── Logging ───────────────────────────────────────────────────────────────
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# ── Channel survey ────────────────────────────────────────────────────────
# Bring-up only — costs radio time and log bandwidth (see the Kconfig help).
CONFIG_EW_BLE_CHANNEL_SURVEY=y

# ── Debuggability ─────────────────────────────────────────────────────────
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_RESET_ON_FATAL_ERROR=n
