# OpenOCD configuration for Every Watch via a Raspberry Pi Pico running
# picoprobe / debugprobe firmware.
#
# Wiring (Pico -> watch SWD pads):
#   GP2  -> SWCLK
#   GP3  -> SWDIO
#   GND  -> GND
#   Do NOT feed the watch from the Pico's 3V3 — power the watch from its own
#   battery or USB, and share only ground.
#
# Current Raspberry Pi debugprobe firmware enumerates as CMSIS-DAP. If you are
# running the older original picoprobe firmware, replace the interface line
# with:  source [find interface/picoprobe.cfg]

source [find interface/cmsis-dap.cfg]

transport select swd

source [find target/nrf52.cfg]

# CMSIS-DAP over a Pico is comfortable at 4 MHz. Drop to 1000 if you see
# "Error connecting DP: cannot read IDR" or intermittent flash failures —
# long jumper leads to the SWD pads are usually the cause.
adapter speed 4000

# nRF52833 is not in older OpenOCD target files by name; the generic nrf52
# target above handles it. Requires OpenOCD 0.11 or newer.
