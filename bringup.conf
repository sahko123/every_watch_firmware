# Bring-up overlay — console over SEGGER RTT (requires a J-Link on the SWD pads)
#
#   west build -b every_watch/nrf52833 every_watch_firmware -- -DEXTRA_CONF_FILE=bringup.conf
#
# Use this one for first power-on. The debugger is already attached to flash the
# board, RTT costs no pins, works on battery, and — unlike a USB console — it is
# alive from the first instruction, so you see failures that happen before USB
# would have had a chance to enumerate.
#
# Once the board is known good and you are flashing over USB with dfu-util,
# switch to bringup_usb.conf so you do not need the debugger attached.

# ── Console ───────────────────────────────────────────────────────────────
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# ── Logging ───────────────────────────────────────────────────────────────
# Production prj.conf pins this at ERROR to save flash. During bring-up we want
# everything, and in immediate mode so a crash cannot swallow the last messages
# still sitting in the deferred log buffer.
# INFO, not DEBUG. Level 4 enables <dbg> for every subsystem including kernel
# mutex tracing, which floods the console and buries the self-test report.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# The self-test report is written before a host attaches; RTT drops what does
# not fit, so give it room.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# ── Self-test ─────────────────────────────────────────────────────────────
CONFIG_EW_SELFTEST=y
# The LED sweep, pixel walk and button prompts are skipped: they take about a
# minute of every boot and are only wanted when a board is new. Set to y for
# first bring-up of fresh hardware.
CONFIG_EW_SELFTEST_INTERACTIVE=n

# ── IMU axis bring-up ─────────────────────────────────────────────────────
# Logs the accelerometer vector at 2 Hz and keeps the sensor running with the
# display off, so the axis mapping can be read back by holding the board in a
# known orientation. Off: the mapping was established on 2026-08-03 and the
# readings are recorded in src/imu/imu.c. Leaving it on runs the accelerometer
# continuously, which the <10 uA idle target cannot absorb. Turn it back on if
# the sensor is ever moved or a new board revision changes its orientation.
CONFIG_EW_IMU_AXIS_DEBUG=n

# ── Interactive shell ─────────────────────────────────────────────────────
# `i2c scan i2c@40003000`, `sensor get bmi270@68`, `device list` — poke at
# peripherals by hand without reflashing.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
# Logs and shell must not share an RTT channel. Logs stay on buffer 0 (what
# `JLinkRTTViewer` shows by default); the shell moves to buffer 1.
CONFIG_SHELL_BACKEND_RTT_BUFFER=1
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=3
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=3
CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_DEVICE_SHELL=y

# Shell and verbose logging need more room than the production build.
CONFIG_MAIN_STACK_SIZE=4096

# prj.conf uses nano printf to save ~1 KB, but SENSOR_SHELL force-selects
# floating-point printf support, which nano cannot provide. Bring-up builds are
# not flash constrained, so take the full implementation.
CONFIG_CBPRINTF_NANO=n
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Debuggability ─────────────────────────────────────────────────────────
# Keep symbols and readable faults; -Os in prj.conf makes stack traces confusing.
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_THREAD_NAME=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_RESET_ON_FATAL_ERROR=n
